<!-- _shell.html -->
<!-- Topbar -->
<header class="topbar">
  <!-- Mobile only (desktop hides this — the left sidebar carries its own
       .sb-brand instead). Logo+name replaces the old hamburger icon as the
       menu open/close trigger — same toggleMobileSidebar() handler, just
       moved so there's one top row instead of two stacked ones, and the
       search bar has real room instead of living in a second row below it. -->
  <button
    class="tb-brand"
    id="hamburger"
    data-onclick="toggleMobileSidebar" data-onclick-event
    title="Menu"
    type="button"
  >
    <div class="tb-logo">
      <img src="{{ asset('/static/sivarr_mark_outline.png') }}" alt="Sivarr" />
    </div>
    <!-- Text kept updated to the open panel's name on mobile (nav(), js/app.js)
         -- "Sivarr" is just the pre-JS/fallback default. -->
    <span class="tb-name" id="tb-brand-name">Sivarr</span>
  </button>
  <!-- Mobile: search moved into the sidebar drawer's own top row (.sb-top-search)
       so it opens alongside the drawer instead of always sitting in the topbar.
       This button now only ever renders for the desktop body.sb-retracted
       fallback (see css/layout.css) -- do not delete, mobile just hides it. -->
  <button class="tb-search" data-onclick="cmdOpen" aria-label="Search or jump to">
    <i class="ti ti-search"></i>
    <span>Search…</span>
  </button>

  <!-- Autosave status -->
  <span id="global-save-status" class="global-save-status"></span>

  <!-- Right actions -->
  <div class="tb-right">
    <!-- Top bar cleanup: Quick Add moved to the sidebar header; Fullscreen
         moved to the profile dropdown; Dark Mode + Announcements already in
         the dropdown. Notifications bell kept (distinct from Announcements). -->
    <!-- Notifications. On mobile this whole bell+panel is relocated into
         the account dropdown instead (see _mobNotifInit(), js/app.js) --
         hidden here at that point, purely a desktop affordance below. -->
    <div id="notif-wrap" style="position: relative">
      <button
        class="tb-icon-btn"
        id="notif-btn"
        data-onclick="notifToggle"
        title="Notifications"
        data-tip="Notifications"
        data-tip-pos="bottom"
      >
        <i class="ti ti-bell"></i>
        <span
          id="notif-badge"
          style="
            display: none;
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--bg);
          "
        ></span>
      </button>
      <div
        id="notif-panel"
        style="
          display: none;
          position: absolute;
          top: calc(100% + 8px);
          right: 0;
          width: 320px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 14px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
          z-index: 9999;
          overflow: hidden;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
          "
        >
          <span style="font-size: 0.85rem; font-weight: 700"
            >Notifications</span
          >
          <button
            data-onclick="notifMarkAllRead"
            style="
              background: none;
              border: none;
              color: var(--teal);
              font-size: 0.75rem;
              cursor: pointer;
              font-family: var(--font);
            "
          >
            Mark all read
          </button>
        </div>
        <div id="notif-list" style="max-height: 340px; overflow-y: auto"></div>
      </div>
    </div>
    <!-- Profile -->
    <div class="profile-menu" id="profile-menu">
      <button
        class="profile-trigger"
        id="profile-trigger"
        data-onclick="toggleProfile"
        data-tip="Account"
        data-tip-pos="bottom"
      >
        <div class="pa" id="tb-av" style="overflow: hidden">?</div>
      </button>
      <!-- Hidden name span kept for JS compat -->
      <span class="pn" id="tb-name" style="display: none">User</span>

      <div class="profile-dropdown" id="profile-dropdown">
        <!-- Header with avatar + upload -->
        <div
          class="pd-header"
          style="text-align: center; padding: 14px 10px 14px"
        >
          <div
            style="
              position: relative;
              display: inline-block;
              margin-bottom: 8px;
            "
            data-onclick="_triggerPfpInput"
            title="Change photo"
          >
            <div
              class="pa"
              id="tb-av-big"
              style="
                width: 56px;
                height: 56px;
                font-size: 1.2rem;
                border-radius: 50%;
                background: linear-gradient(
                  135deg,
                  var(--accent),
                  var(--accent2)
                );
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--font);
                font-weight: 700;
                color: #fff;
                cursor: pointer;
                overflow: hidden;
                margin: 0 auto;
                box-shadow: 0 0 0 3px var(--border);
              "
            >
              ?
            </div>
            <div
              style="
                position: absolute;
                bottom: 0;
                right: 0;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.6rem;
                cursor: pointer;
                border: 2px solid var(--card);
              "
            >
              ✏
            </div>
          </div>
          <input
            type="file"
            id="pfp-input"
            accept="image/*"
            style="display: none"
            data-onchange="uploadProfilePic" data-onchange-this
          />
          <div class="pd-name" id="pd-name">Your Name</div>
          <div class="pd-matric" id="pd-matric">Account</div>
          <button
            class="pd-change-photo-btn"
            data-onclick="_triggerPfpInput"
          >
            Change photo
          </button>
        </div>

        <button
          class="pd-item"
          data-onclick="_navThenCloseProfile" data-onclick-arg0="stats"
        >
          <i class="ti ti-chart-bar pd-icon"></i> My Progress
        </button>
        <button
          class="pd-item"
          data-onclick="_navThenCloseProfile" data-onclick-arg0="notes"
        >
          <i class="ti ti-notebook pd-icon"></i> My Notes
        </button>
        <button
          class="pd-item"
          data-onclick="_navThenCloseProfile" data-onclick-arg0="calendar"
        >
          <i class="ti ti-calendar pd-icon"></i> Calendar
        </button>
        <button
          class="pd-item"
          data-onclick="_navThenCloseProfile" data-onclick-arg0="announcements"
        >
          <i class="ti ti-bell pd-icon"></i> Announcements
        </button>

        <div class="pd-divider"></div>

        <div class="pd-toggle" data-onclick="toggleThemeFromMenu">
          <div class="pd-toggle-left">
            <i class="ti ti-moon pd-icon" id="pd-theme-icon"></i>
            <span id="pd-theme-label">Dark Mode</span>
          </div>
          <div class="toggle-sw" id="pd-toggle-sw"></div>
        </div>

        <button class="pd-item" data-onclick="toggleFullscreen">
          <i class="ti ti-maximize pd-icon" id="pd-fullscreen-icon"></i>
          <span id="pd-fullscreen-label">Fullscreen</span>
        </button>

        <div class="pd-divider"></div>

        <button
          class="pd-item"
          data-onclick="_showPricingThenCloseProfile"
        >
          <i class="ti ti-rocket pd-icon"></i>
          Upgrade Plan
          <span
            id="billing-plan-badge"
            style="
              margin-left: auto;
              font-size: 0.68rem;
              padding: 2px 7px;
              border-radius: 10px;
              background: var(--bg3);
              color: var(--muted);
              font-weight: 700;
            "
            >Free</span
          >
        </button>

        <div class="pd-divider"></div>

        <button class="pd-item danger" data-onclick="logout">
          <i class="ti ti-logout pd-icon"></i> Sign out
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Overlay for mobile sidebar -->
<div
  class="overlay"
  id="overlay"
  data-onclick="_overlayClick"
></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <!-- Brand header — logo, name, search, and the collapse toggle all live in
       this one fixed row now (shown on both desktop and mobile). This row is
       deliberately kept out of everything .sidebar.collapsed hides/shrinks —
       see the CSS: only .sb-scroll below it narrows to an icon rail. -->
  <div class="sb-brand">
    <!-- The logo+name IS the collapse toggle now — no separate button, so it
         actually does something instead of just sitting there, and the
         search bar gets the space back (was cramped on narrow phones). -->
    <button
      class="sb-brand-btn"
      data-onclick="sbToggleRail"
      title="Collapse sidebar"
      data-tip="Collapse sidebar"
      data-tip-pos="bottom"
      aria-label="Collapse sidebar"
    >
      <div class="tb-logo">
        <img src="{{ asset('/static/sivarr_mark_outline.png') }}" alt="Sivarr" />
      </div>
      <span class="sb-brand-name">Sivarr</span>
      <i class="ti ti-layout-sidebar-left-collapse sb-brand-caret" id="sb-rail-icon"></i>
      <i class="ti ti-arrow-left sb-mob-close-icon" style="display: none"></i>
    </button>
    <button
      class="sb-top-search"
      data-onclick="cmdOpen"
      aria-label="Search or jump to"
    >
      <i class="ti ti-search"></i>
      <span>Search or jump to…</span>
      <span class="sb-top-kbd">⌘K</span>
    </button>
  </div>

  <div class="sb-scroll">
    <!-- Pinned: Sivarr AI / Home / Inbox — always here, not user-editable.
         Collapsible: fully hides when collapsed. -->
    <div
      class="sb-section-row sb-sec-head"
      id="sb-favs-head"
      data-onclick="sbTogglePinned"
      title="Show/hide Pinned"
    >
      <span
        class="sb-section-label"
        style="margin: 0; display: flex; align-items: center; gap: 5px"
      >
        <i
          class="ti ti-chevron-down sb-sec-caret"
          id="sb-favs-caret"
          aria-hidden="true"
        ></i
        >Pinned
      </span>
    </div>
    <div class="sb-nav-group" id="sb-favs">
      <!-- rendered by navRenderSidebar() -->
    </div>

    <!-- Starred — tabs the user starred via the ⌘K palette (toggleNavTab/getNavTabs).
         Was never rendered anywhere before this fix: navRenderSidebar() only ever
         painted the fixed core group and Connect, so starring a tab saved to
         localStorage correctly but nothing showed up in the sidebar. -->
    <div class="sb-section-row sb-sec-head" id="sgi-starred-head">
      <span class="sb-section-label" style="margin: 0">Starred</span>
    </div>
    <div class="sb-nav-group" id="sgi-starred">
      <!-- rendered by navRenderSidebar() -->
    </div>

    <!-- Connect — flat, no collapse, always shows all 5 (no pin-filtering) -->
    <div class="sb-section-row">
      <span class="sb-section-label" style="margin: 0">Connect</span>
    </div>
    <div class="sb-nav-group" id="sgi-connect">
      <!-- rendered by navRenderSidebar() -->
    </div>

    <!-- Spaces — the one dropdown -->
    <div
      class="sb-section-row sb-spaces-head"
      id="sb-spaces-head"
      data-onclick="spacesToggle"
      title="Show/hide spaces"
    >
      <span
        class="sb-section-label"
        style="margin: 0; display: flex; align-items: center; gap: 5px"
      >
        <i
          class="ti ti-chevron-down sb-spaces-caret"
          id="sb-spaces-caret"
          aria-hidden="true"
        ></i
        >Spaces
      </span>
      <button
        class="sb-spaces-add"
        data-onclick="openCreateSpaceModal"
        title="New space"
        data-tip="New space"
        data-tip-pos="right"
      >
        <i class="ti ti-plus"></i>
      </button>
    </div>
    <div class="sb-nav-group" id="sgi-spaces">
      <div id="sb-spaces-list">
        <!-- rendered by spaceRenderSidebar() -->
      </div>
    </div>

    <!-- Continuation: Settings / Plans / Help & Support — flat, sits directly under Spaces, no divider, no footer -->
    <div class="sb-nav-group" style="margin-top: 2px">
      <button class="si" data-onclick="nav" data-onclick-args='["settings", null]'>
        <div class="si-icon"><i class="ti ti-settings"></i></div>
        <span class="si-lb">Settings</span>
      </button>
      <button class="si" data-onclick="showPricing">
        <div class="si-icon"><i class="ti ti-bolt"></i></div>
        <span class="si-lb">Plans</span>
        <span class="si-stat" id="sb-plan-label">Free Plan</span>
      </button>
      <button
        class="si"
        data-onclick="nav" data-onclick-args='["help", null]'
        aria-label="Help and Support"
      >
        <div class="si-icon"><i class="ti ti-lifebuoy"></i></div>
        <span class="si-lb">Help &amp; Support</span>
      </button>
    </div>
  </div>
  <!-- Sidebar ends at Help & Support — no footer -->
</aside>
